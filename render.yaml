# Free configuration requested by the owner.
# SQLite data is temporary and may be lost on restarts or deploys.
services:
  - type: web
    name: fajwadev
    runtime: python
    plan: free
    buildCommand: python -m zipfile -e fajwadev_Render_Ready.zip . && pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.9
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
